<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lost & Found AI</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#B86B54;
  --primary-dark:#945440;
  --accent:#D4826A;
  --bg:#F7F1E8;
  --panel:#FFFDF9;
  --soft:#F3EAE0;
  --soft-2:#EDE1D4;
  --text:#463F39;
  --muted:#8A8178;
  --border:#DCCFC1;
  --shadow:0 8px 28px rgba(93,70,50,.08);
  --danger:#B85E5E;
  --danger-bg:#F7E7E4;
  --info:#6D7180;
  --white:#FFFDF9;
}
[data-theme="dark"]{
  --bg:#211F1D; --panel:#2B2826; --soft:#332F2C; --soft-2:#403A36;
  --text:#F0E9E1; --muted:#B3A9A0; --border:#4A433E;
  --shadow:0 8px 28px rgba(0,0,0,.24); --danger-bg:#402C2C;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.55}
button,input,select,textarea{font:inherit}button{cursor:pointer}
header{height:76px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:1000}
.logo{display:flex;align-items:center;gap:12px}.logo-icon{width:45px;height:45px;border-radius:14px;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:23px}.logo h1{font:600 1.25rem 'Lora',serif}.logo p{font-size:.72rem;color:var(--muted)}
.theme-toggle{width:40px;height:40px;border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:50%;font-size:18px}
.layout{display:flex;min-height:calc(100vh - 76px)}
.sidebar{width:245px;flex:0 0 245px;background:var(--bg);border-right:1px solid var(--border);padding:22px 14px;position:sticky;top:76px;height:calc(100vh - 76px);overflow-y:auto}
.sidebar-label{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:900;padding:9px 12px 6px}.sidebar-group{margin-bottom:12px}
.sidebar-btn{width:100%;display:flex;align-items:center;gap:11px;border:0;background:transparent;color:var(--text);padding:12px 13px;border-radius:12px;text-align:left;font-weight:800;font-size:.84rem;transition:.18s}.sidebar-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}.sidebar-btn:hover{background:var(--soft)}.sidebar-btn.active{background:rgba(184,107,84,.15);color:var(--primary-dark);box-shadow:inset 3px 0 0 var(--primary)}
.sidebar-note{margin-top:25px;padding:14px 12px;border-top:1px solid var(--border);color:var(--muted);font-size:.72rem}
main{flex:1;min-width:0;padding:27px 30px 55px}.content{max-width:1120px;margin:auto}
.hero{background:linear-gradient(120deg,#B86B54,#D4826A);color:#fff;border-radius:22px;padding:30px 34px;display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:23px;overflow:hidden}.hero h2{font:600 1.7rem 'Lora',serif;margin-bottom:7px}.hero p{max-width:680px;font-size:.86rem;opacity:.94}.hero-badge{display:inline-block;margin-top:12px;padding:6px 11px;border-radius:20px;background:rgba(255,255,255,.15);font-size:.7rem;font-weight:800}.hero-icon{width:105px;height:105px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center;font-size:53px;flex:0 0 auto}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:24px;box-shadow:var(--shadow);margin-bottom:20px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:20px}.panel-title{display:flex;align-items:center;gap:11px}.panel-icon{width:42px;height:42px;background:var(--soft);border-radius:12px;display:grid;place-items:center;font-size:19px}.panel-title h3{font:600 1.08rem 'Lora',serif}.panel-title p{font-size:.74rem;color:var(--muted)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.full{grid-column:1/-1}.field{margin-bottom:3px}.field label{display:block;font-size:.79rem;font-weight:900;margin-bottom:7px}.required{color:var(--primary)}.control{width:100%;padding:11px 12px;border:1px solid var(--border);background:var(--soft);color:var(--text);border-radius:10px;outline:0;font-size:.84rem}.control:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(184,107,84,.12)}textarea.control{min-height:95px;resize:vertical}.helper{font-size:.7rem;color:var(--muted);margin-top:5px}.other-wrap{margin-top:8px}.hidden{display:none!important}
.contact-box{background:var(--soft);border:1px solid var(--border);padding:14px;border-radius:12px;margin-top:4px}.contact-box h4{font-size:.82rem;margin-bottom:3px}.contact-box p{font-size:.7rem;color:var(--muted);margin-bottom:10px}
.photo-upload{border:2px dashed var(--border);background:var(--soft);min-height:150px;border-radius:14px;display:flex;align-items:center;justify-content:center;text-align:center;padding:18px;cursor:pointer;overflow:hidden}.photo-upload:hover{border-color:var(--primary);background:rgba(184,107,84,.06)}.photo-upload input{display:none}.upload-icon{font-size:32px}.upload-content h4{font:600 1rem 'Lora',serif}.upload-content p{font-size:.72rem;color:var(--muted)}.photo-preview{display:none;flex-direction:column;align-items:center;gap:8px}.photo-preview img{max-height:180px;max-width:100%;border-radius:10px}.remove-photo{border:0;background:var(--danger-bg);color:var(--danger);border-radius:8px;padding:6px 11px;font-size:.7rem;font-weight:900}.no-photo{display:flex;align-items:flex-start;gap:9px;margin-top:9px;padding:11px;background:var(--soft);border:1px solid var(--border);border-radius:10px}.no-photo input{accent-color:var(--primary);margin-top:3px}.no-photo strong{font-size:.78rem}.no-photo small{display:block;color:var(--muted);font-size:.68rem}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:19px}.primary{border:0;background:var(--primary);color:#fff;padding:12px 18px;border-radius:10px;font-weight:900}.primary:hover{background:var(--primary-dark)}.primary:disabled{opacity:.6;cursor:not-allowed}.secondary{border:1px solid var(--border);background:transparent;color:var(--text);padding:10px 14px;border-radius:10px;font-weight:800}.secondary:hover{border-color:var(--primary);color:var(--primary)}
.feed-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:15px}.item-card{border:1px solid var(--border);background:var(--panel);border-radius:15px;overflow:hidden}.item-image{height:155px;background:var(--soft);display:flex;align-items:center;justify-content:center}.item-image img{width:100%;height:100%;object-fit:cover}.no-image{font-size:2.1rem;color:var(--muted)}.item-body{padding:15px}.item-body h4{font-size:.9rem;margin-bottom:5px}.item-body p{font-size:.72rem;color:var(--muted);margin:3px 0}.item-meta{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0}.chip{font-size:.63rem;font-weight:900;padding:4px 7px;border-radius:20px;background:var(--soft);color:var(--text)}.status{font-size:.63rem;font-weight:900;padding:4px 8px;border-radius:20px}.status.pending{background:var(--soft-2);color:var(--primary-dark)}.status.found{background:#E9E0D6;color:#6E513F}.contact-line{border-top:1px solid var(--border);margin-top:10px;padding-top:9px;font-size:.7rem}.contact-line strong{display:block;font-size:.68rem;color:var(--muted);margin-bottom:2px}.card-actions{display:flex;gap:7px;margin-top:11px}.card-actions button{flex:1;padding:8px;border-radius:8px;font-size:.67rem;font-weight:900}.delete-btn{border:1px solid #D8B4AE;background:var(--danger-bg);color:var(--danger)}.found-btn{border:1px solid var(--border);background:var(--soft);color:var(--primary-dark)}
.empty{padding:45px 20px;text-align:center;color:var(--muted)}.empty-icon{font-size:38px;margin-bottom:8px}.empty h3{font:600 1rem 'Lora',serif;color:var(--text);margin-bottom:5px}.empty p{font-size:.76rem}
.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.profile-stat{background:var(--soft);border:1px solid var(--border);padding:18px;border-radius:14px}.profile-stat span{display:block;font-size:.7rem;color:var(--muted)}.profile-stat strong{font-size:1.4rem}.history-section{margin-top:20px}.history-section h4{font:600 1rem 'Lora',serif;margin-bottom:12px}
.algo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}.algo-stat{background:var(--soft);border:1px solid var(--border);border-radius:13px;padding:15px}.algo-stat span{display:block;font-size:.68rem;color:var(--muted);font-weight:800}.algo-stat strong{display:block;font-size:1.2rem;margin-top:3px}.trace-box{border:1px solid var(--border);border-radius:13px;background:var(--soft);max-height:360px;overflow:auto}.trace-row{display:grid;grid-template-columns:28px 1fr auto;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border);font-size:.72rem;align-items:center}.trace-row:last-child{border-bottom:0}.trace-num{width:24px;height:24px;border-radius:7px;background:var(--panel);display:grid;place-items:center;font-size:.62rem;font-weight:900}.trace-action{font-weight:900}.trace-meta{color:var(--muted);font-size:.66rem}.metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:15px 0}.metric{background:var(--soft);border:1px solid var(--border);border-radius:12px;padding:14px}.metric span{display:block;color:var(--muted);font-size:.66rem;font-weight:800}.metric strong{font-size:1.15rem}.eval-table{width:100%;border-collapse:collapse;font-size:.7rem}.eval-table th,.eval-table td{border-bottom:1px solid var(--border);padding:9px;text-align:left;vertical-align:top}.eval-table th{color:var(--muted);font-size:.64rem;text-transform:uppercase;letter-spacing:.04em}.algorithm-note{padding:13px;border:1px solid var(--border);background:var(--soft);border-radius:12px;font-size:.72rem;color:var(--muted);margin-top:14px}

.modal-backdrop{position:fixed;inset:0;background:rgba(42,31,24,.58);display:none;align-items:center;justify-content:center;padding:20px;z-index:2000}.modal-backdrop.show{display:flex}.modal{width:min(820px,100%);max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:22px;box-shadow:0 20px 70px rgba(0,0,0,.25)}.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin-bottom:15px}.modal-head h3{font:600 1.25rem 'Lora',serif}.modal-head p{font-size:.73rem;color:var(--muted)}.close{border:0;background:var(--soft);color:var(--text);width:34px;height:34px;border-radius:50%;font-size:18px}.match-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}.match-card{border:1px solid var(--border);border-radius:15px;overflow:hidden;background:var(--panel)}.match-img{height:150px;background:var(--soft);display:flex;align-items:center;justify-content:center}.match-img img{width:100%;height:100%;object-fit:cover}.match-body{padding:14px}.match-score{font-size:.68rem;font-weight:900;color:var(--primary-dark);margin-bottom:7px}.match-body h4{font-size:.92rem;margin-bottom:6px}.match-body p{font-size:.72rem;color:var(--muted);margin:3px 0}.match-contact{margin-top:10px;padding-top:9px;border-top:1px solid var(--border)}.match-contact strong{font-size:.68rem;color:var(--muted);display:block}.match-contact div{font-size:.74rem;color:var(--text);font-weight:800}
.toast{position:fixed;right:20px;bottom:20px;background:var(--text);color:var(--panel);padding:12px 15px;border-radius:10px;font-size:.75rem;font-weight:800;display:none;z-index:2500}.toast.show{display:block}
@media(max-width:850px){.sidebar{width:215px;flex-basis:215px}main{padding:20px}.form-grid,.profile-grid,.algo-grid,.metric-grid{grid-template-columns:1fr}.full{grid-column:auto}.hero{padding:24px}.hero-icon{display:none}}
@media(max-width:650px){header{height:68px;padding:0 14px}.layout{min-height:calc(100vh - 68px)}.sidebar{position:fixed;z-index:1100;top:auto;bottom:0;left:0;width:100%;height:70px;padding:5px 6px;border-right:0;border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(5,1fr);gap:3px}.sidebar-label,.sidebar-note{display:none}.sidebar-group{display:contents}.sidebar-btn{padding:6px 2px;display:flex;flex-direction:column;justify-content:center;gap:3px;text-align:center;font-size:.58rem;border-radius:8px}.sidebar-btn svg{width:18px;height:18px}main{padding:14px 12px 88px}.hero{margin-bottom:15px}.panel{padding:17px}.actions{flex-direction:column}.actions button{width:100%}}

.match-card{cursor:pointer}.active-filter{background:var(--primary);color:#fff;border-color:var(--primary)}
.match-card:focus{outline:2px solid var(--primary);outline-offset:2px}
.weak-badge{display:inline-block;margin-left:6px;padding:3px 7px;border-radius:999px;background:rgba(212,130,106,.14);font-size:.68em;vertical-align:middle}
</style>
</head>
<body>
<header>
  <div class="logo"><div class="logo-icon">⌕</div><div><h1>Lost &amp; Found AI</h1><p>Community item recovery system</p></div></div>
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">☾</button>
</header>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-group">
      <div class="sidebar-label">Submissions</div>
      <button class="sidebar-btn active" data-page="lost-report"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Report Lost Item</span></button>
      <button class="sidebar-btn" data-page="found-report"><svg viewBox="0 0 24 24"><path d="M4 8h16v12H4zM2 8l2-4h16l2 4M9 12h6"/></svg><span>Report Found Item</span></button>
    </div>
    <div class="sidebar-group">
      <div class="sidebar-label">Community</div>
      <button class="sidebar-btn" data-page="news-feed"><svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5zM4 5.5v15M8 7h8M8 11h8M8 15h5"/></svg><span>News Feed</span></button>
    </div>
    <div class="sidebar-group">
      <div class="sidebar-label">Tools</div>
      <button class="sidebar-btn" data-page="algorithm"><svg viewBox="0 0 24 24"><path d="M4 18h16M6 15l3-4 3 2 5-7 1 4"/></svg><span>Algorithm Dashboard</span></button>
      <button class="sidebar-btn" data-page="evaluation"><svg viewBox="0 0 24 24"><path d="M5 19V9M12 19V5M19 19v-8"/></svg><span>Evaluation</span></button>
    </div>
    <div class="sidebar-group">
      <div class="sidebar-label">Account</div>
      <button class="sidebar-btn" data-page="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-4 3.2-6 7-6s6.2 2 7 6"/></svg><span>My Profile</span></button>
    </div>
    <div class="sidebar-note">Your reports are saved under your local profile so you can review, update, or delete them later.</div>
  </aside>
  <main><div class="content" id="app"></div></main>
</div>

<div class="modal-backdrop" id="matchModal">
  <div class="modal">
    <div class="modal-head"><div><h3 id="modalTitle">Possible Matches</h3><p id="modalSubtitle">Items that may match the report you just submitted.</p></div><button class="close" id="closeModal">×</button></div>
    <div id="matchResults" class="match-grid"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const API = {
  lost:'/api/lost-items', found:'/api/found-items', searchLost:'/api/search', searchFound:'/api/search-found',
  feed:'/api/feed', profile:'/api/profile', items:'/api/items'
};
const app = document.getElementById('app');
const userId = localStorage.getItem('lf_user_id') || (crypto.randomUUID ? crypto.randomUUID() : 'user-' + Date.now() + '-' + Math.random().toString(16).slice(2));
localStorage.setItem('lf_user_id', userId);
let currentPage='lost-report';
let pendingPhoto=null, pendingPhotoName=null;

const icons={lost:'⌕',found:'✓',feed:'▤',profile:'●',algorithm:'⌁',evaluation:'▥'};
function esc(v){return String(v ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtDate(v){if(!v)return '-';const d=new Date(v.replace(' ','T'));return Number.isNaN(d.getTime())?v:d.toLocaleString([], {year:'numeric',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);}
function pageTitle(page){return ({'lost-report':['Report a Lost Item','Submit details about an item you can no longer find.'], 'found-report':['Report a Found Item','Submit details about an item you picked up or found.'], 'news-feed':['News Feed','Browse recent lost and found reports from the community.'], 'profile':['My Profile','Review your report history and current report status.'], 'algorithm':['Algorithm Dashboard','View the search process, scores, nodes explored, and the latest matching trace.'], 'evaluation':['Evaluation','Run the built-in benchmark for semantic matching against the keyword baseline.']})[page];}
function hero(title,desc,icon){return `<section class="hero"><div><h2>${esc(title)}</h2><p>${esc(desc)}</p><span class="hero-badge">Required contact details help people coordinate recovery.</span></div><div class="hero-icon">${icon}</div></section>`;}

function renderReport(kind){
 const found=kind==='found';
 pendingPhoto=null;pendingPhotoName=null;
 app.innerHTML=hero(found?'Report a Found Item':'Report a Lost Item',found?'Tell the community what you found so the owner can identify it.':'Tell the community what you lost so a possible matching report can be identified.',found?'✓':'⌕')+`
 <section class="panel">
  <div class="panel-head"><div class="panel-title"><div class="panel-icon">${found?'✓':'⌕'}</div><div><h3>${found?'Found Item Details':'Lost Item Details'}</h3><p>Complete all required fields before submitting.</p></div></div></div>
  <form id="reportForm">
   <div class="form-grid">
    <div class="field"><label>Item Category <span class="required">*</span></label><select class="control" id="category" required><option value="">Select category</option><option>Electronics</option><option>Phone</option><option>Wallet</option><option>Headphones</option><option>Backpack</option><option>Umbrella</option><option>Watch</option><option>Other</option></select><div id="categoryOtherWrap" class="other-wrap hidden"><input class="control" id="categoryOther" placeholder="Enter item category"></div></div>
    <div class="field"><label>Location <span class="required">*</span></label><select class="control" id="zone" required><option value="">Select location</option><option>Library</option><option>Canteen</option><option>Main Gate</option><option>Computer Laboratory</option><option>Classroom</option><option>Other</option></select><div id="zoneOtherWrap" class="other-wrap hidden"><input class="control" id="zoneOther" placeholder="Enter location"></div></div>
    <div class="field"><label>Color <span class="required">*</span></label><select class="control" id="color" required><option value="">Select color</option><option>Black</option><option>Brown</option><option>Navy</option><option>Silver</option><option>Red</option><option>White</option><option>Other</option></select><div id="colorOtherWrap" class="other-wrap hidden"><input class="control" id="colorOther" placeholder="Enter color"></div></div>
    <div class="field"><label>Brand <span class="required">*</span></label><input class="control" id="brand" required placeholder="e.g. Samsung, JBL, Casio"></div>
    <div class="field"><label>Date &amp; Time ${found?'Found':'Lost'} <span class="required">*</span></label><input class="control" type="datetime-local" id="eventTime" required><p class="helper">Use the date and time when the item was found or last seen.</p></div>
    <div class="field"><label>Your Name <span class="required">*</span></label><input class="control" id="ownerName" required placeholder="Name of the owner / person who found it"></div>
    <div class="field full"><div class="contact-box"><h4>Contact Details <span class="required">*</span></h4><p>${found?'Provide contact details so the possible owner can reach you.':'Provide contact details so the person who found a possible match can reach you.'}</p><input class="control" id="contactInfo" required maxlength="180" placeholder="Phone number, email, Messenger username, etc."></div></div>
    <div class="field full"><label>Item Description <span class="required">*</span></label><textarea class="control" id="description" required placeholder="Describe the item in detail: appearance, size, unique marks, case, scratches, contents, or anything that can help identify it."></textarea><p class="helper">The AI matching process uses the description together with category, color, brand, location, and date/time.</p></div>
    <div class="field full"><label>Item Photo <span class="required">*</span></label><div class="photo-upload" id="photoUpload"><input type="file" id="photoInput" accept="image/png,image/jpeg,image/webp"><div class="upload-content" id="uploadContent"><div class="upload-icon">▧</div><h4>Upload an item photo</h4><p>JPG, PNG, or WEBP · maximum 5 MB</p></div><div class="photo-preview" id="photoPreview"><img id="previewImage"><span id="photoName"></span><button type="button" class="remove-photo" id="removePhoto">Remove photo</button></div></div><label class="no-photo"><input type="checkbox" id="noPhoto"><span><strong>No photo available</strong><small>Use this only if you genuinely do not have a photo.</small></span></label></div>
   </div>
   <div class="actions"><button type="button" class="secondary" id="resetForm">Clear</button><button type="submit" class="primary" id="submitBtn">Submit ${found?'Found':'Lost'} Item</button></div>
  </form>
 </section>`;
 setupReportForm(kind);
}

function setupReportForm(kind){
 const found=kind==='found', form=document.getElementById('reportForm');
 ['category','zone','color'].forEach(id=>{document.getElementById(id).addEventListener('change',()=>{const sel=document.getElementById(id);const wrap=document.getElementById(id+'OtherWrap');const input=document.getElementById(id+'Other');const other=sel.value==='Other';wrap.classList.toggle('hidden',!other);if(input)input.required=other;});});
 const upload=document.getElementById('photoUpload'), input=document.getElementById('photoInput'), preview=document.getElementById('photoPreview'), content=document.getElementById('uploadContent'), noPhoto=document.getElementById('noPhoto');
 upload.addEventListener('click',e=>{if(e.target===input||e.target.closest('button'))return;if(!noPhoto.checked)input.click()});
 input.addEventListener('change',()=>processPhoto(input.files[0]));
 noPhoto.addEventListener('change',()=>{if(noPhoto.checked){clearPhoto();upload.style.opacity='.45';upload.style.pointerEvents='none'}else{upload.style.opacity='1';upload.style.pointerEvents='auto'}});
 document.getElementById('removePhoto').addEventListener('click',e=>{e.stopPropagation();clearPhoto()});
 document.getElementById('resetForm').addEventListener('click',()=>{form.reset();clearPhoto();document.getElementById('categoryOtherWrap').classList.add('hidden');document.getElementById('zoneOtherWrap').classList.add('hidden');document.getElementById('colorOtherWrap').classList.add('hidden');upload.style.opacity='1';upload.style.pointerEvents='auto'});
 form.addEventListener('submit',e=>submitReport(e,kind));
 function clearPhoto(){pendingPhoto=null;pendingPhotoName=null;input.value='';preview.style.display='none';content.style.display='block';document.getElementById('previewImage').src='';document.getElementById('photoName').textContent='';}
 function processPhoto(file){if(!file)return;if(!['image/jpeg','image/png','image/webp'].includes(file.type)){showToast('Please use JPG, PNG, or WEBP.');return}if(file.size>5*1024*1024){showToast('Photo must not exceed 5 MB.');return}const reader=new FileReader();reader.onload=e=>{pendingPhoto=e.target.result;pendingPhotoName=file.name;document.getElementById('previewImage').src=pendingPhoto;document.getElementById('photoName').textContent=file.name;content.style.display='none';preview.style.display='flex'};reader.readAsDataURL(file)}
}

async function submitReport(e,kind){
 e.preventDefault();const found=kind==='found';const btn=document.getElementById('submitBtn');btn.disabled=true;btn.textContent='Submitting...';
 const val=id=>document.getElementById(id).value.trim();
 const pick=(id,otherId)=>{const v=val(id);return v==='Other'?val(otherId):v};
 const photoNotAvailable=document.getElementById('noPhoto').checked;
 const payload={user_id:userId,owner_name:val('ownerName'),contact_info:val('contactInfo'),category:pick('category','categoryOther'),zone:pick('zone','zoneOther'),color:pick('color','colorOther'),brand:val('brand'),event_datetime:val('eventTime'),description_raw:val('description'),photo_data:photoNotAvailable?null:pendingPhoto,photo_name:photoNotAvailable?null:pendingPhotoName,photo_not_available:photoNotAvailable,tau:.70,k:6};
 try{
  const response=await fetch(found?API.found:API.lost,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  const data=await response.json().catch(()=>({}));
  if(response.status===409&&data.duplicate){if(confirm(data.error+'\n\nSubmit this as a separate report?')){payload.allow_duplicate=true;const retry=await fetch(found?API.found:API.lost,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const retryData=await retry.json();if(!retry.ok)throw new Error(retryData.error||'Unable to submit report.');await afterSubmission(found,payload,retryData.id)}else{return}}
  else if(!response.ok)throw new Error(data.error||'Unable to submit report.');
  else await afterSubmission(found,payload,data.id);
 }catch(err){showToast(err.message||'Submission failed.')}finally{btn.disabled=false;btn.textContent='Submit '+(found?'Found':'Lost')+' Item'}
}

async function afterSubmission(found,payload,id){
 showToast('Report submitted successfully. Searching for possible matches...');
 let matchData;
 try{const response=await fetch(found?API.searchFound:API.search,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...payload,report_id:id})});matchData=await response.json();if(!response.ok)throw new Error(matchData.error||'Matching failed.')}catch(err){showToast('Report saved, but matching could not be completed.');matchData={results:[]}}
 let evaluationData=null;
 try{
  const evalResponse=await fetch('/api/evaluation/benchmark?tau='+encodeURIComponent(payload.tau||.70));
  evaluationData=await evalResponse.json();
  if(!evalResponse.ok) throw new Error(evaluationData.error||'Evaluation failed.');
  localStorage.setItem('lf_last_evaluation', JSON.stringify({data:evaluationData,submitted_at:new Date().toISOString()}));
 }catch(_){
  // Matching remains usable even if the optional benchmark cannot run.
 }
 localStorage.setItem('lf_last_algorithm', JSON.stringify({kind:found?'found':'lost', data:matchData, submitted_at:new Date().toISOString(), evaluation:evaluationData}));
 openMatchModal(found,matchData.results||[]);
}

function openMatchModal(found,results){
 const modal=document.getElementById('matchModal'), box=document.getElementById('matchResults');document.getElementById('modalTitle').textContent=results.length?`${results.length} Possible Match${results.length===1?'':'es'} Found`:'No Possible Matches Yet';document.getElementById('modalSubtitle').textContent=found?'These lost-item reports may be related to the item you found.':'These found-item reports may be related to the item you lost.';
 box.innerHTML=results.length?results.map((r,i)=>matchCard(r,found,i)).join(''):`<div class="empty" style="grid-column:1/-1"><div class="empty-icon">⌕</div><h3>No matching reports found</h3><p>Your report is saved. Check the ${found?'Found':'Lost'} News Feed later for new reports.</p></div>`;modal.classList.add('show');
}
function matchCard(r,found,index){return `<article class="match-card" role="button" tabindex="0" data-match-index="${index}" onclick="openAlgorithmFromMatch(${index})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openAlgorithmFromMatch(${index})}"><div class="match-img">${r.photo_data?`<img src="${r.photo_data}" alt="Possible matching item">`:'<span class="no-image">▧</span>'}</div><div class="match-body"><div class="match-score">${(Number(r.similarity)*100).toFixed(1)}% SIMILARITY ${r.weak_match?'<span class="weak-badge">WEAK / POSSIBLE</span>':''}</div><h4>${esc(r.color)} ${esc(r.brand)} ${esc(r.category)}</h4><p><strong>Location:</strong> ${esc(r.zone)}</p><p><strong>Date &amp; time:</strong> ${esc(fmtDate(r.event_datetime))}</p><p><strong>Description:</strong> ${esc(r.description_raw)}</p><div class="match-contact"><strong>${found?'Reported by the possible owner':'Reported by the person who found it'}</strong><div>${esc(r.owner_name||'Community reporter')}</div><strong style="margin-top:5px">Contact</strong><div>${esc(r.contact_info||'Contact unavailable')}</div></div><div class="helper" style="margin-top:10px">Click to view the Algorithm Dashboard and search trace.</div></div></article>`}

function openAlgorithmFromMatch(index){
 const saved=localStorage.getItem('lf_last_algorithm');
 if(!saved)return;
 document.getElementById('matchModal').classList.remove('show');
 navigate('algorithm');
 setTimeout(()=>{const target=document.querySelector('.trace-box');if(target)target.scrollIntoView({behavior:'smooth',block:'start'});},50);
}

async function renderFeed(){
 app.innerHTML=hero('News Feed','Browse community reports. Use the filter to view Lost or Found posts.','▤')+`<section class="panel"><div class="panel-head"><div class="panel-title"><div class="panel-icon">▤</div><div><h3>Community News Feed</h3><p>Lost and found reports are shown together.</p></div></div><button class="secondary" id="refreshFeed">Refresh</button></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px"><button class="secondary feed-filter active-filter" data-filter="all">All</button><button class="secondary feed-filter" data-filter="lost">Lost</button><button class="secondary feed-filter" data-filter="found">Found</button></div><div id="feedGrid" class="feed-grid"></div></section>`;
 const grid=document.getElementById('feedGrid');grid.innerHTML='<div class="empty" style="grid-column:1/-1">Loading reports...</div>';
 let allItems=[];
 const load=async(filter='all')=>{try{const r=await fetch(API.feed+'?type='+encodeURIComponent(filter)+'&limit=100',{headers:{'Accept':'application/json'}});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||`News Feed API failed (HTTP ${r.status}).`);allItems=data.items||[];grid.innerHTML=allItems.length?allItems.map(itemCard).join(''):`<div class="empty" style="grid-column:1/-1"><div class="empty-icon">▤</div><h3>No ${filter==='all'?'':filter+' '}reports yet</h3><p>Submitted reports will appear here.</p></div>`;}catch(err){grid.innerHTML=`<div class="empty" style="grid-column:1/-1"><h3>Unable to load reports</h3><p>${esc(err.message)}</p></div>`}};
 document.querySelectorAll('.feed-filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.feed-filter').forEach(x=>x.classList.remove('active-filter'));b.classList.add('active-filter');load(b.dataset.filter)});
 document.getElementById('refreshFeed').onclick=()=>{const active=document.querySelector('.feed-filter.active-filter');load(active?active.dataset.filter:'all')};
 await load('all');
}
function itemCard(item){const found=item.report_type==='found';return `<article class="item-card"><div class="item-image">${item.photo_data?`<img src="${item.photo_data}" alt="${esc(item.category)}">`:'<span class="no-image">▧</span>'}</div><div class="item-body"><div class="item-meta"><span class="status ${found?'found':'pending'}">${found?'FOUND':'LOST'}</span><span class="chip">${esc(item.zone)}</span></div><h4>${esc(item.color)} ${esc(item.brand)} ${esc(item.category)}</h4><p><strong>Date:</strong> ${esc(fmtDate(item.event_datetime))}</p><p>${esc(item.description_raw)}</p><div class="contact-line"><strong>Reported by</strong>${esc(item.owner_name||'Community reporter')}</div></div></article>`}

async function renderProfile(){
 app.innerHTML=hero('My Profile','Your submitted lost and found reports are listed here. You can review their status or delete your own posts.','●')+`<section class="panel"><div class="panel-head"><div class="panel-title"><div class="panel-icon">●</div><div><h3>Profile History</h3><p>Your reports are linked to this browser profile.</p></div></div><button class="secondary" id="refreshProfile">Refresh</button></div><div id="profileStats" class="profile-grid"></div><div class="history-section"><h4>Lost Items History</h4><div id="lostHistory" class="feed-grid"></div></div><div class="history-section"><h4>Found Items History</h4><div id="foundHistory" class="feed-grid"></div></div></section>`;
 await loadProfile();document.getElementById('refreshProfile').onclick=loadProfile;
}
async function loadProfile(){
 try{
  const urls=[API.profile+'?user_id='+encodeURIComponent(userId),API.profile+'/'+encodeURIComponent(userId)];
  let r=null,data={};
  for(const url of urls){r=await fetch(url,{headers:{'Accept':'application/json'}});data=await r.json().catch(()=>({}));if(r.ok)break;if(r.status!==404)throw new Error(data.error||`Profile API failed (HTTP ${r.status}).`)}
  if(!r||!r.ok)throw new Error(data.error||'Profile API route not found.');
  document.getElementById('profileStats').innerHTML=`<div class="profile-stat"><span>Name</span><strong>${esc(data.owner_name||'No report submitted yet')}</strong></div><div class="profile-stat"><span>Reports</span><strong>${(data.lost_items||[]).length+(data.found_items||[]).length}</strong></div>`;
  document.getElementById('lostHistory').innerHTML=(data.lost_items||[]).length?data.lost_items.map(i=>historyCard(i,'lost')).join(''):`<div class="empty" style="grid-column:1/-1"><p>No lost-item reports.</p></div>`;
  document.getElementById('foundHistory').innerHTML=(data.found_items||[]).length?data.found_items.map(i=>historyCard(i,'found')).join(''):`<div class="empty" style="grid-column:1/-1"><p>No found-item reports.</p></div>`;
  bindHistoryActions();
 }catch(err){showToast(err.message||'Unable to load profile history.')}
}
function historyCard(item,kind){return `<article class="item-card"><div class="item-image">${item.photo_data?`<img src="${item.photo_data}" alt="${esc(item.category)}">`:'<span class="no-image">▧</span>'}</div><div class="item-body"><h4>${esc(item.color)} ${esc(item.brand)} ${esc(item.category)}</h4><div class="item-meta"><span class="chip">${esc(item.zone)}</span><span class="status ${item.status==='found'?'found':'pending'}">${item.status==='found'?'FOUND':'PENDING'}</span></div><p><strong>Date:</strong> ${esc(fmtDate(item.event_datetime))}</p><p>${esc(item.description_raw)}</p><div class="card-actions">${item.status!=='found'?`<button class="found-btn" data-status="found" data-kind="${kind}" data-id="${item.id}">Mark as Found</button>`:`<button class="found-btn" data-status="pending" data-kind="${kind}" data-id="${item.id}">Set Pending</button>`}<button class="delete-btn" data-delete="${kind}" data-id="${item.id}">Delete Post</button></div></div></article>`}
function bindHistoryActions(){document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this report? This cannot be undone.'))return;const kind=b.dataset.delete,id=b.dataset.id;const r=await fetch(`${API.items}/${kind}/${id}?user_id=${encodeURIComponent(userId)}`,{method:'DELETE'});const d=await r.json();if(!r.ok){showToast(d.error||'Unable to delete.');return}showToast('Post deleted.');loadProfile()});document.querySelectorAll('[data-status]').forEach(b=>b.onclick=async()=>{const kind=b.dataset.kind,id=b.dataset.id,status=b.dataset.status;const r=await fetch(`${API.items}/${kind}/${id}/status?user_id=${encodeURIComponent(userId)}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});const d=await r.json();if(!r.ok){showToast(d.error||'Unable to update status.');return}showToast('Status updated.');loadProfile()})}

function renderAlgorithm(){
 const saved=localStorage.getItem('lf_last_algorithm');
 let payload=null;try{payload=saved?JSON.parse(saved):null}catch(_){payload=null}
 const data=payload?.data;
 if(!data){
  app.innerHTML=hero('Algorithm Dashboard','The dashboard will show the latest matching process after you submit a Lost or Found Item.','⌁')+`<section class="panel"><div class="empty"><div class="empty-icon">⌁</div><h3>No algorithm run yet</h3><p>Submit a Lost or Found Item first. The matching result and search details will appear here.</p></div></section>`;return;
 }
 const isFound=payload.kind==='found';
 const results=data.results||[], trace=data.trace||[], weights=data.weights||{};
 const weightText=Object.entries(weights).map(([k,v])=>`${esc(k)}: ${Number(v).toFixed(2)}`).join(' · ');
 const traceHtml=trace.length?trace.map((t,i)=>`<div class="trace-row"><div class="trace-num">${i+1}</div><div><div class="trace-action">${esc(String(t.action||'step').replaceAll('_',' ').toUpperCase())}</div><div class="trace-meta">Node: ${esc(t.node_id||'-')} · Type: ${esc(t.type||'-')}</div></div><div class="trace-meta">Ŝ=${t.s_hat??'-'} · h=${t.h??'-'}</div></div>`).join(''):`<div class="empty"><h3>No hierarchical trace available</h3><p>Found-item reverse matching evaluates the eligible lost reports directly using the same weighted similarity components.</p></div>`;
 const resultRows=results.length?results.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.owner_name||'Community reporter')}</td><td>${esc(r.category)} / ${esc(r.color)} / ${esc(r.brand)}</td><td>${(Number(r.similarity)*100).toFixed(1)}%</td><td>${Number(r.path_cost).toFixed(4)}</td></tr>`).join(''):`<tr><td colspan="5">No candidates reached the similarity threshold.</td></tr>`;
 app.innerHTML=hero('Algorithm Dashboard',isFound?'Latest run: Found Item → Lost Item matching.':'Latest run: Lost Item → Found Item matching.','⌁')+`<section class="panel"><div class="panel-head"><div class="panel-title"><div class="panel-icon">⌁</div><div><h3>${isFound?'Reverse Weighted Matching':'Hierarchical Greedy Best-First Search'}</h3><p>Matching threshold: ${(Number(data.threshold??.70)*100).toFixed(0)}% · Maximum results: ${results.length||0}</p></div></div><button class="secondary" id="clearAlgorithm">Clear Run</button></div><div class="algo-grid"><div class="algo-stat"><span>Nodes Explored</span><strong>${data.nodes_explored??0}</strong></div><div class="algo-stat"><span>Nodes Pruned</span><strong>${data.nodes_pruned??0}</strong></div><div class="algo-stat"><span>Eligible Records</span><strong>${isFound?(data.eligible_lost_records??0):(data.eligible_found_records??0)}</strong></div></div><div class="algorithm-note"><strong>Method:</strong> ${isFound?'The found-item report is compared against eligible lost reports using the weighted similarity components.':'The lost-item report is searched using Hierarchical Greedy Best-First Search, where the priority is h(n) = 1 − Ŝ(n), with category and location hierarchy used for pruning.'}<br><strong>Weights:</strong> ${weightText||'Not returned'}</div></section><section class="panel"><div class="panel-head"><div class="panel-title"><div class="panel-icon">≋</div><div><h3>Algorithm Trace</h3><p>${trace.length} recorded steps from the latest run.</p></div></div></div><div class="trace-box">${traceHtml}</div></section><section class="panel"><div class="panel-head"><div class="panel-title"><div class="panel-icon">✦</div><div><h3>Ranked Results</h3><p>Top candidate scores returned by the matcher.</p></div></div></div><div style="overflow:auto"><table class="eval-table"><thead><tr><th>#</th><th>Reporter</th><th>Item</th><th>Similarity</th><th>Path Cost</th></tr></thead><tbody>${resultRows}</tbody></table></div></section>` + (()=>{
  const ev=payload?.evaluation || (()=>{try{return JSON.parse(localStorage.getItem('lf_last_evaluation')||'null')?.data}catch(_){return null}})();
  if(!ev?.semantic_search)return '';
  const m=ev.semantic_search;
  return `<section class="panel"><div class="panel-head"><div class="panel-title"><div class="panel-icon">▥</div><div><h3>Automatic Evaluation</h3><p>Benchmark run automatically after this search.</p></div></div></div><div class="metric-grid"><div class="metric"><span>Accuracy</span><strong>${(m.accuracy*100).toFixed(1)}%</strong></div><div class="metric"><span>Precision</span><strong>${(m.precision*100).toFixed(1)}%</strong></div><div class="metric"><span>Recall</span><strong>${(m.recall*100).toFixed(1)}%</strong></div><div class="metric"><span>F1 Score</span><strong>${(m.f1_score*100).toFixed(1)}%</strong></div></div></section>`;
 })();
 document.getElementById('clearAlgorithm').onclick=()=>{localStorage.removeItem('lf_last_algorithm');renderAlgorithm()};
}

async function renderEvaluation(){
 app.innerHTML=hero('Evaluation','Evaluation runs automatically from the latest search. You can rerun the benchmark manually when needed.','▥')+`<section class="panel"><div class="panel-head"><div class="panel-title"><div class="panel-icon">▥</div><div><h3>Matching Evaluation Benchmark</h3><p>Results are calculated automatically when you open this dashboard.</p></div></div><button class="primary" id="runEvaluation">Run Evaluation</button></div><div class="form-grid"><div class="field"><label>Similarity Threshold</label><input class="control" id="evalTau" type="number" min="0" max="1" step="0.01" value="0.70"><p class="helper">0 to 1. A higher value requires a stronger match.</p></div><div class="field"><label>Manual Predictions <span class="helper">optional</span></label><input class="control" id="manualPredictions" placeholder='e.g. {"exact":"1","partial":"4","conflict":null,"no_match":null}'><p class="helper">Only enter this if you want to compare against human-selected predictions.</p></div></div><div id="evaluationOutput"><div class="empty"><div class="empty-icon">▥</div><h3>Analyzing latest search...</h3><p>Running the evaluation benchmark automatically.</p></div></section>`;
 const run=async()=>{
  const btn=document.getElementById('runEvaluation'),out=document.getElementById('evaluationOutput');btn.disabled=true;btn.textContent='Running...';out.innerHTML='<div class="empty"><p>Running benchmark...</p></div>';
  try{
   const tau=Math.max(0,Math.min(1,Number(document.getElementById('evalTau').value||.70)));
   let url='/api/evaluation/benchmark?tau='+encodeURIComponent(tau);const manual=document.getElementById('manualPredictions').value.trim();if(manual)url+='&manual_predictions='+encodeURIComponent(manual);
   const r=await fetch(url,{headers:{'Accept':'application/json'}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||`Evaluation API failed (HTTP ${r.status}).`);
   localStorage.setItem('lf_last_evaluation',JSON.stringify({data:d,submitted_at:new Date().toISOString()}));
   const metric=(name,m)=>`<div class="panel" style="margin-top:15px"><div class="panel-title"><div class="panel-icon">${name==='Semantic Similarity + Best-First Search'?'⌁':'▤'}</div><div><h3>${esc(name)}</h3><p>Benchmark metrics</p></div></div><div class="metric-grid"><div class="metric"><span>Accuracy</span><strong>${(m.accuracy*100).toFixed(1)}%</strong></div><div class="metric"><span>Precision</span><strong>${(m.precision*100).toFixed(1)}%</strong></div><div class="metric"><span>Recall</span><strong>${(m.recall*100).toFixed(1)}%</strong></div><div class="metric"><span>F1 Score</span><strong>${(m.f1_score*100).toFixed(1)}%</strong></div></div></div>`;
   const rows=(d.cases||[]).map(c=>`<tr><td>${esc(c.scenario)}</td><td>${esc(c.expected_id??'No match')}</td><td>${esc(c.semantic_prediction??'No match')}</td><td>${c.semantic_correct?'Correct':'Incorrect'}</td><td>${esc(c.keyword_prediction??'No match')}</td>${d.manual_matching?`<td>${esc(c.manual_prediction??'No match')}</td>`:''}</tr>`).join('');
   out.innerHTML=metric('Semantic Similarity + Best-First Search',d.semantic_search)+metric('Keyword Baseline',d.keyword_baseline)+(d.manual_matching?metric('Human Manual Baseline',d.manual_matching):'')+`<section class="panel"><div class="panel-title"><div class="panel-icon">≋</div><div><h3>Case Results</h3><p>${esc(d.dataset_note)}</p></div></div><div style="overflow:auto"><table class="eval-table"><thead><tr><th>Scenario</th><th>Expected</th><th>Semantic</th><th>Outcome</th><th>Keyword</th>${d.manual_matching?'<th>Manual</th>':''}</tr></thead><tbody>${rows}</tbody></table></div><div class="algorithm-note">${esc(d.manual_note||'')}</div></section>`;
  }catch(err){out.innerHTML=`<div class="empty"><h3>Evaluation failed</h3><p>${esc(err.message)}</p></div>`}finally{btn.disabled=false;btn.textContent='Run Evaluation'}
 };
 document.getElementById('runEvaluation').onclick=run;
 await run();
}
function navigate(page){currentPage=page;document.querySelectorAll('.sidebar-btn').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(page==='lost-report')renderReport('lost');else if(page==='found-report')renderReport('found');else if(page==='news-feed')renderFeed('all');else if(page==='algorithm')renderAlgorithm();else if(page==='evaluation')renderEvaluation();else renderProfile();window.scrollTo({top:0,behavior:'smooth'})}
document.querySelectorAll('.sidebar-btn').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.page)));
document.getElementById('closeModal').onclick=()=>document.getElementById('matchModal').classList.remove('show');document.getElementById('matchModal').addEventListener('click',e=>{if(e.target.id==='matchModal')e.currentTarget.classList.remove('show')});
const themeToggle=document.getElementById('themeToggle');function setTheme(t){document.documentElement.setAttribute('data-theme',t);themeToggle.textContent=t==='dark'?'☀':'☾'}setTheme(localStorage.getItem('lf_theme')||'light');themeToggle.onclick=()=>{const next=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';localStorage.setItem('lf_theme',next);setTheme(next)};
navigate('lost-report');
</script>
